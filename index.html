
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Neo! 💚</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="confetti" class="confetti-container"></div>
    <div id="balloons" class="balloons-container"></div>

    <main class="birthday-card">
        <p class="small-heading">A SPECIAL DAY FOR SOMEONE SPECIAL</p>

        <h1 id="birthday-title">Happy Birthday, Neo! 💚</h1>

        <p class="subtitle">
            Today is all about celebrating you, my sweet. 🌿
        </p>

        <div class="birthday-decoration">🎂 🎈 🎁</div>

        <section class="message">
            <h2>A little message for you...</h2>
            <p>I've written something special for you, my sweet. 💚</p>

            <button id="reveal-button" class="reveal-button" type="button">
                Open your little surprise ♡
            </button>

            <div id="message-reveal" class="message-reveal hidden">
                <p id="personal-message"></p>
            </div>
        </section>

        <p class="footer-message">Made especially for you ♡</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
